# Configuration for threaded pg_upgrade TAP coverage.
#
# pg_upgrade's t/002 harness runs the core regression schedule in the old
# cluster before upgrading it, so keep the threaded TAP baseline plus settings
# that the core schedule expects from ordinary check-world runs.
multithreaded = on
io_method = sync
summarize_wal = off
max_prepared_transactions = 2
timezone = 'America/Los_Angeles'
